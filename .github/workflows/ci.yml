name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v2

    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run pytest with coverage
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html

    - name: Run linting (ruff)
      run: |
        pip install ruff  # Ensure ruff is installed
        ruff check backend/app  # Lint the app directory 

    - name: Run linting (ESLint)
      run: |
        npm install
        npx eslint . --fix

    - name: Enforce coverage threshold
      run: |
        COVERAGE=$(pytest --cov=app --cov-report=term | tail -n 1 | awk '{print $NF}' | tr -d '()')
        echo "Coverage is: $COVERAGE"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Error: Code coverage is below 80%"
          exit 1
        fi

    - name: Check for clean clone
      run: |
        git diff --exit-code
      continue-on-error: true
